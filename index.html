<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="refresh" content="1; url=https://george-and-eilidh-get-married.up.railway.app/">
    <script>
        window.location.href = "https://george-and-eilidh-get-married.up.railway.app/"
      </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>George & Eilidh's Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            color: #333;
            background-color: #f9f7f5;
        }
        .bg-image {
            background-image: url('https://source.unsplash.com/1600x900/?wedding,flowers');
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            filter: brightness(0.7);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
        }
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8em;
            margin-bottom: 20px;
            color: #4a4a4a;
            font-weight: 300;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        p {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1em;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 20px;
        }
        a {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25em;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto 20px;
            text-decoration: none;
            color: #8b8b8b;
        }
        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5em;
            margin-bottom: 10px;
            color: #8b8b8b;
        }
        .couple-image {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border-radius: 0%;
            overflow: hidden;
            border: 0px solid #fff;
        }
        .couple-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .more-info {
            cursor: pointer;
            color: #8b8b8b;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.25em;
        }
        .more-info:hover {
            text-decoration: underline;
        }
        .register-link {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="container">
        <h1>George & Eilidh</h1>
        <div class="couple-image">
          <img src="media/shell.png" alt="George and Eilidh">
        </div>
        <p class="date">30th August 2025</p>
        <p>East Lothian, Scotland</p>
        <div class="more-info" onclick="toggleRegister()">
            More Info <i class="fas fa-chevron-down"></i>
        </div>
        <div class="register-link">
            <a href="https://george-and-eilidh-get-married.up.railway.app/">Enter Site</a>
        </div>
    </div>

    <script>
        function toggleRegister() {
            var registerLink = document.querySelector('.register-link');
            var moreInfo = document.querySelector('.more-info i');
            if (registerLink.style.display === 'none' || registerLink.style.display === '') {
                registerLink.style.display = 'block';
                moreInfo.classList.remove('fa-chevron-down');
                moreInfo.classList.add('fa-chevron-up');
            } else {
                registerLink.style.display = 'none';
                moreInfo.classList.remove('fa-chevron-up');
                moreInfo.classList.add('fa-chevron-down');
            }
        }
    </script>
</body>
</html>
